<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Склад и инвентар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1d2320; --muted:#6b726e; --line:#e4e0d7;
  --accent:#1d6b4f; --accent-soft:#e3f0ea; --warn:#b4700b; --warn-soft:#fbf0dc;
  --danger:#b83227; --danger-soft:#fbe6e3; --ok:#2f7d4f; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding:16px 14px 80px}
header.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.status.saved i{background:var(--ok)} .status.pending i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;background:#ebe7de;padding:4px;border-radius:12px;margin:10px 0 14px;overflow-x:auto}
nav.tabs a{flex:1;text-align:center;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:14px}
nav.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-block;min-width:19px;padding:0 6px;border-radius:10px;font-size:11.5px;line-height:19px;margin-left:5px;background:var(--danger);color:#fff;font-weight:700}
.badge.n{background:#cfc9bc;color:var(--ink)}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid #efd7a8;color:#6b4407;padding:11px 14px;border-radius:var(--radius);margin-bottom:12px}
.alert.red{background:var(--danger-soft);border-color:#f0c4be;color:#7b1f17}
.alert .txt{flex:1;min-width:200px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px}
.tile span{color:var(--muted);font-size:12.5px}
.tile.warn b{color:var(--warn)} .tile.danger b{color:var(--danger)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;background:#ebe7de;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:40px;background:#ebe7de;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#17583f}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:#cfc9bc}
.btn.danger{background:var(--danger);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;min-height:0;font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:center}
.item.low{border-left-color:var(--warn)} .item.out{border-left-color:var(--danger);background:#fffafa}
.item-name{font-weight:700;font-size:15.5px}
.meta{color:var(--muted);font-size:12.5px}
.ord{color:var(--accent);font-weight:700}
.bar{position:relative;height:6px;background:#eeeae2;border-radius:4px;margin:7px 0 5px;max-width:280px}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.low .bar span{background:var(--warn)} .out .bar span{background:var(--danger)}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:#8a857a;left:50%}
.item-qty{text-align:right}
.qty{font-size:22px;font-weight:800;letter-spacing:-.4px}
.qty small{font-size:13px;color:var(--muted);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--ok)}
.chip.low{background:var(--warn-soft);color:var(--warn)} .chip.out{background:var(--danger-soft);color:var(--danger)}
.chip.draft{background:#ece9e2;color:#5b5850} .chip.sent{background:#e1ecf8;color:#24598f} .chip.received{background:var(--accent-soft);color:var(--ok)}
.item-actions{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h3{margin:0 0 4px;font-size:16px}
.order{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.order-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.order-head h3{margin:0;font-size:16px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid #efece5;text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
td input{width:90px;min-height:34px;padding:5px 8px;text-align:right}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px}
.x:hover{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row.between{justify-content:space-between}
.total{font-weight:800}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px;font-weight:700}
.hist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hist .h{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid #efece5;align-items:center}
.hist .h:last-child{border-bottom:0}
.d-plus{color:var(--ok);font-weight:800} .d-minus{color:var(--danger);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(20,24,22,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.hidden{display:none}
.sheet{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 6px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.fld input,.fld select,.fld textarea{color:var(--ink);font-weight:500;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.radio label{cursor:pointer}
.radio input{position:absolute;opacity:0}
.radio span{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;font-size:13.5px}
.radio input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#1d2320;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:16px;bottom:18px;z-index:15;display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:13px 18px;font-weight:800;font-size:15px;box-shadow:0 8px 22px rgba(29,107,79,.35);cursor:pointer}
.fab:hover{background:#17583f}
.btn.big{width:100%;padding:16px;font-size:16.5px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.scanres{margin-top:12px;border-radius:12px;padding:12px 14px;background:#f3f1ec;border:1px solid var(--line)}
.scanres.ok{background:var(--accent-soft);border-color:#bfdccd}
.scanres.err{background:var(--danger-soft);border-color:#f0c4be;color:#7b1f17}
.scanres .big-n{font-size:20px;font-weight:800}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.3px}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;min-height:0;padding:0;border:0}
.btn.big.alt{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px;padding:12px;font-size:15px}
.cam{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:4/3}
.cam.off{display:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .guide{position:absolute;left:8%;right:8%;top:25%;bottom:25%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);transition:border-color .15s,box-shadow .15s}
.cam .guide i{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d3d;box-shadow:0 0 8px #ff4d3d;animation:scanl 1.6s ease-in-out infinite alternate}
.cam:not(.live) .guide i{display:none}
.cam.hit .guide{border-color:#3ddc84;box-shadow:0 0 0 999px rgba(61,220,132,.3)}
@keyframes scanl{from{top:12%}to{top:88%}}
.torch{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.torch.on{background:#ffd34d;color:#000}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px;line-height:2}
@media (max-width:720px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .item{grid-template-columns:1fr auto}
  .item-actions{grid-column:1/-1;justify-content:flex-end}
  .item-actions .btn{flex:1}
  .hist .h{grid-template-columns:1fr auto}
  .hist .h .when{grid-column:1/-1;order:-1}
  .grid2{grid-template-columns:1fr}
  .brand p{display:none}
}
</style>
</head>

function valid(x){ return x && Array.isArray(x.items) && Array.isArray(x.suppliers) && Array.isArray(x.orders) && Array.isArray(x.moves); }

// ---------- state & persistence (this browser) ----------
let S = null;
try { const l = localStorage.getItem(KEY); if (l) S = JSON.parse(l); } catch (e) { S = null; }
if (!valid(S)) { try { S = JSON.parse(document.getElementById('state').textContent); } catch (e) { S = null; } }
if (!valid(S)) S = seed();

let UI = {q: '', cat: '', f: 'all', hq: ''};
try { Object.assign(UI, JSON.parse(localStorage.getItem(KEY + '-ui') || '{}')); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(KEY + '-ui', JSON.stringify(UI)); } catch (e) {} };

let capturing = false, lastScan = null, dirty = false, saveTimer = null, storageOk = true;

function paintStatus(){
  const el = $('#status');

  el.querySelector('span').textContent = dirty ? 'Запазване…' : (storageOk ? 'Запазено на устройството' : 'Не може да се запази!');
}
function commit(){
  dirty = true; render(); paintStatus();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300);
}
function flush(){
  if (!dirty) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
  dirty = false; paintStatus();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

// ---------- helpers ----------
const item = id => S.items.find(i => i.id === id);
const sup = id => S.suppliers.find(s => s.id === id);
const nid = () => ++S.seq;
const st = i => i.qty <= 0 ? 'out' : (i.qty <= i.min ? 'low' : 'ok');
const STL = {ok: 'В наличност', low: 'Под минимума', out: 'Изчерпан'};
const openOrders = () => S.orders.filter(o => o.status !== 'received');

const lowItems = () => S.items.filter(i => st(i) !== 'ok');

function addMove(itemId, type, delta, note){

function warnCross(it, before){

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// ---------- render ----------
const TABS = [['stock', 'Наличности'], ['orders', 'Поръчки'], ['history', 'Движения'], ['suppliers', 'Доставчици']];
const view = () => { const v = (location.hash || '#stock').slice(1); return TABS.some(t => t[0] === v) ? v : 'stock'; };
window.addEventListener('hashchange', render);

  $('#tabs').innerHTML = TABS.map(([k, l]) => {

function renderAlerts(low){

  el.innerHTML = '<div class="alert ' + (out.length ? 'red' : '') + '"><div class="txt"><b>' +
    (out.length ? '⛔ ' : '⚠ ') + low.length + ' ' + (low.length === 1 ? 'артикул е' : 'артикула са') + ' под минимума' +
    (out.length ? ', ' + out.length + ' ' + (out.length === 1 ? 'изчерпан' : 'изчерпани') : '') + '</b><br><span style="font-size:13px">' + names + (low.length > 4 ? '…' : '') +

function renderList(){
  const q = UI.q.trim().toLowerCase(); const rank = {out: 0, low: 1, ok: 2};
  const arr = S.items.filter(i =>
    (!q || (i.name + ' ' + (i.barcode || '') + ' ' + (i.cat || '') + ' ' + ((sup(i.supplierId) || {}).name || '')).toLowerCase().includes(q)) &&
    (!UI.cat || i.cat === UI.cat) &&
    (UI.f === 'all' || (UI.f === 'low' && st(i) !== 'ok') || (UI.f === 'out' && st(i) === 'out'))
  ).sort((a, b) => rank[st(a)] - rank[st(b)] || a.name.localeCompare(b.name, 'bg'));

function card(i){
  const s = st(i); const pct = i.min > 0 ? Math.min(100, Math.max(0, i.qty) / (i.min * 2) * 100) : 100;

    (inOrd ? ' · <span class="ord">поръчани ' + num(inOrd) + ' ' + esc(i.unit) + '</span>' : '') + '</div></div>' +

function renderOrders(){
  const low = lowItems(); const notOrdered = low.filter(i => !openOrderQty(i.id));
  const open = S.orders.filter(o => o.status !== 'received').sort((a, b) => b.created - a.created);

function orderTotal(o){ return o.lines.reduce((a, l) => a + ((item(l.itemId) || {}).price || 0) * l.qty, 0); }

  if (o.lines.length) {
    h += '<table><thead><tr><th>Артикул</th><th class="num">Наличност</th><th class="num">Количество</th><th class="num">Сума</th>' + (ed ? '<th></th>' : '') + '</tr></thead><tbody>';

// ---------- barcode decoding ----------
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code', 'data_matrix'];
let zxP = null;
function loadZXing(){
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (zxP) return zxP;
  const urls = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js'];
  zxP = new Promise((res, rej) => { let k = 0; (function next(){
    if (k >= urls.length) { zxP = null; return rej(new Error('load')); }
    const s = document.createElement('script'); s.src = urls[k++]; s.async = true;
    s.onload = () => window.ZXing ? res(window.ZXing) : next();
    s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s); })(); });
  return zxP;
}
function zxFormats(Z){ const F = Z.BarcodeFormat; return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.CODABAR, F.QR_CODE, F.DATA_MATRIX].filter(x => x !== undefined); }
function loadImg(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => res(im); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; });
}
async function decodeFile(file){
  const img = await loadImg(file);
  try {
    const det = await getDetector();
    if (det) { try { const r = await det.detect(img); if (r && r.length) return r[0].rawValue; } catch (e) {} }
    const Z = await loadZXing();
    const hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, zxFormats(Z));
    const reader = new Z.MultiFormatReader();
    const W = img.naturalWidth, H = img.naturalHeight;
    for (const max of [1280, 1900, 900, 2600]) {
      const s = Math.min(1, max / Math.max(W, H)); const c = document.createElement('canvas');
      c.width = Math.round(W * s); c.height = Math.round(H * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      for (const rot of [false, true]) {
        try {
          let src = new Z.HTMLCanvasElementLuminanceSource(c); if (rot) src = src.rotateCounterClockwise();
          const r = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)), hints);
          if (r) return r.getText();
        } catch (e) {} finally { try { reader.reset(); } catch (e) {} }
      }
      if (s === 1) break;
    }
    return null;
  } finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
}
const camInput = (target, cam) => '<input type="file" accept="image/*"' + (cam ? ' capture="environment"' : '') + ' data-scan="' + target + '" aria-label="' + (cam ? 'Снимай баркода' : 'Избери снимка') + '">';

// ---------- live camera: detects the barcode by itself ----------
const cam = {stream: null, video: null, timer: 0, gen: 0, det: null, last: '', lastSeen: 0, cand: '', candN: 0, cool: 0, torch: false};
let actx = null, zxReader = null, zxCanvas = null;
function stopCam(){
  cam.gen++; clearTimeout(cam.timer); cam.video = null;
  if (cam.stream) { try { cam.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
  cam.stream = null; cam.torch = false;
}
async function getDetector(){
  if (cam.det !== null) return cam.det;
  cam.det = false;
  if ('BarcodeDetector' in window) {
    try { const fm = await window.BarcodeDetector.getSupportedFormats(); const want = FORMATS.filter(f => fm.includes(f)); if (want.length) cam.det = new window.BarcodeDetector({formats: want}); } catch (e) {}
  }

}
function camFail(reason){
  stopCam();
  const box = $('#camBox'); if (box) box.classList.add('off');
  const fb = $('#sfallback'); if (fb) fb.hidden = false;
  const msg = $('#camMsg'); if (!msg) return;
  const insecure = !window.isSecureContext;
  msg.innerHTML = '<div class="scanres err" style="text-align:left">' + (
    insecure ? '<b>Камерата иска защитена връзка.</b><br>Отворете страницата през адрес, започващ с https:// (напр. GitHub Pages или Netlify). Дотогава снимайте баркода отдолу.' :
    reason === 'NotAllowedError' || reason === 'SecurityError' ? '<b>Няма достъп до камерата.</b><br>Разрешете камерата за този сайт от настройките на браузъра (иконката до адреса) и отворете скенера пак.' :
    reason === 'NotFoundError' || reason === 'OverconstrainedError' ? 'Не е открита камера на това устройство.' :
    reason === 'NotReadableError' ? 'Камерата се използва от друго приложение – затворете го и отворете скенера пак.' :
    reason === 'load' ? 'Четецът на баркодове не се зареди – проверете интернет връзката.' :
    'Този браузър не поддържа камера на живо – използвайте снимка отдолу.') + '</div>';
}
async function startCam(){
  const g = ++cam.gen; clearTimeout(cam.timer); cam.video = null;
  const box = $('#camBox'); if (!box) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail('unsupported');
  if (!cam.stream || !cam.stream.active) {
    let s;
    try { s = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}}); }
    catch (e) { if (g === cam.gen) camFail(e && e.name); return; }
    if (g !== cam.gen || !$('#camBox')) { s.getTracks().forEach(t => t.stop()); return; }
    cam.stream = s; cam.torch = false;
  }
  const v = box.querySelector('video');
  v.muted = true; v.srcObject = cam.stream;
  try { await v.play(); } catch (e) {}
  if (g !== cam.gen) return;
  cam.video = v;
  const track = cam.stream.getVideoTracks()[0];
  try { await track.applyConstraints({advanced: [{focusMode: 'continuous'}]}); } catch (e) {}
  try { const caps = track.getCapabilities ? track.getCapabilities() : {}; const tb = $('#torchBtn'); if (tb && caps.torch) tb.hidden = false; } catch (e) {}

  const msg = $('#camMsg'); if (msg) msg.textContent = 'Насочете камерата към баркода – засича се сам';
  const det = await getDetector();
  if (!det) { try { await loadZXing(); } catch (e) { if (g === cam.gen) camFail('load'); return; } }

function loop(g){

}
async function detectFrame(v){
  if (cam.det) { const r = await cam.det.detect(v); return r && r.length ? {code: r[0].rawValue, sure: true} : null; }
  const Z = window.ZXing; if (!Z) return null;

    zxReader = new Z.MultiFormatReader(); zxReader.setHints(hints); zxCanvas = document.createElement('canvas');
  }

  ctx.drawImage(v, (W - cw) / 2, (H - ch) / 2, cw, ch, 0, 0, zxCanvas.width, zxCanvas.height);

function onFrame(r){

}

document.addEventListener('click', e => {

    case 'scan': scanModal(); break;
    case 'torch': {
      const t = cam.stream && cam.stream.getVideoTracks()[0]; if (!t) break;
      cam.torch = !cam.torch; t.applyConstraints({advanced: [{torch: cam.torch}]}).catch(() => {});
      el.classList.toggle('on', cam.torch); break;
    }
    case 'smode': UI.sm = el.dataset.m; saveUI(); scanModal($('#sres') ? $('#sres').innerHTML : ''); break;
    case 'undoScan': {
      if (!lastScan) return; const it = item(lastScan.itemId);
      if (it) it.qty = round(Math.max(0, it.qty - lastScan.delta));
      S.moves = S.moves.filter(m => m.id !== lastScan.moveId); lastScan = null; commit();
      $('#sres').innerHTML = '<div class="scanres">Последното сканиране е отменено.</div>'; break;
    }
    case 'export': exportData(); break;
    case 'filter': UI.f = el.dataset.f; saveUI(); render(); break;
    case 'goLow': UI.f = 'low'; UI.q = ''; UI.cat = ''; saveUI(); if (view() !== 'stock') location.hash = '#stock'; else render(); break;
    case 'newItem': itemForm(null); break;
    case 'editItem': itemForm(item(id)); break;
    case 'move': moveForm(item(id)); break;
    case 'inc': case 'dec': {
      const it = item(id); const d = a === 'inc' ? 1 : -1; if (d < 0 && it.qty <= 0) return;
      const delta = d < 0 ? -Math.min(1, it.qty) : 1; const before = st(it); it.qty = round(it.qty + delta);
      const last = S.moves[0];
      if (last && last.itemId === id && last.type === 'quick' && Date.now() - last.t < 120000) { last.delta = round(last.delta + delta); last.t = Date.now(); if (!last.delta) S.moves.shift(); }
      else addMove(id, 'quick', delta, '');
      warnCross(it, before); commit(); break;
    }
    case 'delItem': {
      const it = item(id);
      confirmBox('Да изтрия ли „' + esc(it.name) + '“? Историята на движенията му ще остане.', 'Изтрий', () => {
        S.items = S.items.filter(i => i.id !== id);
        S.orders.forEach(o => { if (o.status === 'draft') o.lines = o.lines.filter(l => l.itemId !== id); });
        commit();
      }); break;
    }
    case 'gen': generateOrders(); break;
    case 'newOrder': {
      modal('<h2>Нова поръчка</h2><label class="fld">Доставчик<select id="nos"><option value="">Без доставчик</option>' + S.suppliers.map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('') + '</select></label>' +
        '<div class="row end"><button class="btn ghost" data-act="close">Отказ</button><button class="btn primary" id="nob">Създай</button></div>');
      $('#nob').onclick = () => { const v = $('#nos').value; S.orders.push({id: nid(), supplierId: v ? +v : null, status: 'draft', created: Date.now(), lines: []}); closeModal(); location.hash = '#orders'; commit(); };
      break;
    }
    case 'rmLine': { const o = ord(el.dataset.o); o.lines.splice(+el.dataset.k, 1); commit(); break; }
    case 'copyOrder': copyOrder(ord(el.dataset.o)); break;
    case 'delOrder': confirmBox('Да изтрия ли поръчка №' + el.dataset.o + '?', 'Изтрий', () => { S.orders = S.orders.filter(o => o.id !== +el.dataset.o); commit(); }); break;
    case 'sendOrder': { const o = ord(el.dataset.o); o.status = 'sent'; o.sentAt = Date.now(); toast('Поръчка №' + o.id + ' е маркирана като изпратена'); commit(); break; }
    case 'backDraft': { const o = ord(el.dataset.o); o.status = 'draft'; delete o.sentAt; commit(); break; }
    case 'receive': {
      const o = ord(el.dataset.o);
      confirmBox('Получена ли е поръчка №' + o.id + '? Всички количества ще бъдат заприходени в склада.', 'Заприходи', () => {
        o.lines.forEach(l => { const it = item(l.itemId); if (it && l.qty > 0) { it.qty = round(it.qty + l.qty); addMove(it.id, 'order', l.qty, 'Поръчка №' + o.id); } });
        o.status = 'received'; o.receivedAt = Date.now(); toast('Наличностите са обновени'); commit();
      }, 'primary'); break;
    }
    case 'newSup': supForm(null); break;
    case 'editSup': supForm(sup(id)); break;
    case 'delSup': confirmBox('Да изтрия ли доставчика? Артикулите му ще останат без доставчик.', 'Изтрий', () => {
      S.suppliers = S.suppliers.filter(s => s.id !== id); S.items.forEach(i => { if (i.supplierId === id) i.supplierId = null; });
      S.orders.forEach(o => { if (o.supplierId === id) o.supplierId = null; }); commit(); }); break;
    case 'wipe': confirmBox('Да изтрия ли <b>всички</b> артикули, доставчици, поръчки и движения? Това не може да се върне.', 'Изчисти всичко', () => { S = emptyState(); commit(); }); break;
    case 'demo': confirmBox('Да заменя ли текущите данни с демо данни за кафене?', 'Зареди демо', () => { S = seed(); commit(); }, 'primary'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.scan) { onScanFile(t); return; }
  if (t.dataset.line) {
    const [oid, k] = t.dataset.line.split(':'); const o = ord(oid); const v = parseNum(t.value);
    if (o && o.lines[+k]) { if (v > 0) o.lines[+k].qty = round(v); else o.lines.splice(+k, 1); commit(); }
  } else if (t.dataset.addline) {
    const o = ord(t.dataset.addline); const it = item(+t.value);
    if (o && it) { o.lines.push({itemId: it.id, qty: st(it) !== 'ok' ? suggestQty(it) : Math.max(1, Math.ceil(it.min) || 1)}); commit(); }
  }
});

render(); paintStatus();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
</body>
</html>
